name: Update RSS articles

on:
  schedule:
    # 매일 한국시간 오전 6시 (UTC 전날 21시)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rss-articles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch RSS feeds and build articles.json
        run: python scripts/fetch_rss.py

      - name: Commit changes only when articles.json changed
        run: |
          if git diff --quiet -- articles.json; then
            echo "articles.json 변경 사항이 없습니다. 커밋을 생략합니다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git commit -m "chore: update RSS articles"
          git push

